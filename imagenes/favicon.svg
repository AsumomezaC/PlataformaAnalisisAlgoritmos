<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: grafo no dirigido con forma de conejo sentado, mirando a la derecha -->
  <rect width="64" height="64" rx="14" fill="#2a1747"/>
  <!-- Aristas -->
  <g stroke="#ecd3f8" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="25" y1="7"  x2="32" y2="24"/> <!-- oreja trasera -->
    <line x1="40" y1="6"  x2="32" y2="24"/> <!-- oreja delantera -->
    <line x1="32" y1="24" x2="47" y2="30"/> <!-- cabeza - nariz -->
    <line x1="47" y1="30" x2="39" y2="42"/> <!-- nariz - pecho -->
    <line x1="39" y1="42" x2="44" y2="56"/> <!-- pata delantera -->
    <line x1="44" y1="56" x2="21" y2="56"/> <!-- patas -->
    <line x1="21" y1="56" x2="9"  y2="44"/> <!-- anca - cola -->
    <line x1="9"  y1="44" x2="18" y2="32"/> <!-- cola - lomo -->
    <line x1="18" y1="32" x2="32" y2="24"/> <!-- lomo - cabeza -->
    <line x1="18" y1="32" x2="39" y2="42"/> <!-- arista interior -->
  </g>
  <!-- Nodos -->
  <g fill="#dd75dd" stroke="#2a1747" stroke-width="1.6">
    <circle cx="25" cy="7"  r="4.6"/>
    <circle cx="40" cy="6"  r="4.6"/>
    <circle cx="32" cy="24" r="5.4"/>
    <circle cx="47" cy="30" r="4.6"/>
    <circle cx="39" cy="42" r="4.6"/>
    <circle cx="44" cy="56" r="4.6"/>
    <circle cx="21" cy="56" r="4.6"/>
    <circle cx="9"  cy="44" r="5.4"/>
    <circle cx="18" cy="32" r="4.6"/>
  </g>
</svg>
